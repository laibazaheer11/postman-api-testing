name: QA API Regression Pipeline
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write 
jobs:
  test-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
      - run: |
          mkdir -p newman
          newman run "GoRest API.postman_collection.json" -e "GoRest Env.postman_environment.json" -r htmlextra --reporter-htmlextra-export newman/gorest-report.html || true
          newman run "OpenWeather API.postman_collection.json" -r htmlextra --reporter-htmlextra-export newman/weather-report.html || true
          newman run "Simple Books API.postman_collection.json" -r htmlextra --reporter-htmlextra-export newman/books-report.html || true
      - uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman/
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./newman
