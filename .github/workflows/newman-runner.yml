name: QA API Regression Pipeline
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g newman newman-reporter-htmlextra
      - run: |
          mkdir -p newman
          newman run "collections/gorest-api.postman_collection.json" \
            --env-var "token=${{ secrets.GOREST_TOKEN }}" \
            -r htmlextra --reporter-htmlextra-export newman/gorest-report.html || true
          
          newman run "collections/openweather-api.postman_collection.json" \
            --env-var "apiKey=${{ secrets.WEATHER_API_KEY }}" \
          -r htmlextra --reporter-htmlextra-export newman/weather-report.html || true
          
          newman run "collections/simple-books-api.postman_collection.json" \
            -r htmlextra --reporter-htmlextra-export newman/books-report.html || true
          
          echo '<html><body><h1>API Reports</h1><a href="gorest-report.html">GoRest</a><br><a href="weather-report.html">Weather</a><br><a href="books-report.html">Books</a></body></html>' > newman/index.html
          ls -la newman/
      - uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./newman
